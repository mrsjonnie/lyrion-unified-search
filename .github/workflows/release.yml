name: Package LMS plugin releases

on:
  push:
    branches:
      - main
    paths:
      - "UnifiedSearch/**"
      - "DefaultLogoHome/**"
      - "repo.xml.in"
      - ".github/workflows/release.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.2"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build plugin ZIPs and SHA-1
        id: package
        shell: bash
        run: |
          mkdir -p dist
          test -f UnifiedSearch/Plugin.pm
          test -f UnifiedSearch/install.xml
          test -f DefaultLogoHome/Plugin.pm
          test -f DefaultLogoHome/install.xml
          zip -r dist/UnifiedSearch-0.1.2.zip UnifiedSearch
          zip -r dist/DefaultLogoHome-0.1.0.zip DefaultLogoHome
          echo "unified_sha=$(sha1sum dist/UnifiedSearch-0.1.2.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "logo_sha=$(sha1sum dist/DefaultLogoHome-0.1.0.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Generate repository XML
        shell: bash
        run: |
          sed \
            -e "s/version=\"0.1.0\"/version=\"0.1.2\"/" \
            -e "s/GENERATED_UNIFIED_SHA1/${{ steps.package.outputs.unified_sha }}/" \
            -e "s/GENERATED_LOGO_SHA1/${{ steps.package.outputs.logo_sha }}/" \
            repo.xml.in > repo.xml

      - name: Commit repository metadata to main
        if: github.ref_type == 'branch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          sed \
            -e "s/version=\"0.1.0\"/version=\"0.1.2\"/" \
            -e "s/GENERATED_UNIFIED_SHA1/${{ steps.package.outputs.unified_sha }}/" \
            -e "s/GENERATED_LOGO_SHA1/${{ steps.package.outputs.logo_sha }}/" \
            repo.xml.in > repo.xml
          git add repo.xml
          git commit -m "Publish LMS add-on repository metadata" || true
          git push origin main

      - name: Create GitHub release
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.2
          name: Lyrion LMS add-ons v0.1.2
          generate_release_notes: true
          files: |
            dist/UnifiedSearch-0.1.2.zip
            dist/DefaultLogoHome-0.1.0.zip
