name: Package LMS plugin releases

on:
  push:
    branches:
      - main
    paths:
      - "UnifiedSearch/**"
      - "DefaultLogoHome/**"
      - "repo.xml.in"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/.*<version>\([^<]*\)<\/version>.*/\1/p' UnifiedSearch/install.xml | head -1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build plugin ZIPs and SHA-1
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          test -f UnifiedSearch/Plugin.pm
          test -f UnifiedSearch/install.xml
          test -f DefaultLogoHome/Plugin.pm
          test -f DefaultLogoHome/install.xml
          zip -r "dist/UnifiedSearch-${VERSION}.zip" UnifiedSearch
          zip -r "dist/DefaultLogoHome-0.1.1.zip" DefaultLogoHome
          echo "unified_sha=$(sha1sum "dist/UnifiedSearch-${VERSION}.zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "logo_sha=$(sha1sum dist/DefaultLogoHome-0.1.1.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Generate repository XML
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed \
            -e "s/UNIFIED_VERSION/${VERSION}/g" \
            -e "s/GENERATED_UNIFIED_SHA1/${{ steps.package.outputs.unified_sha }}/" \
            -e "s/GENERATED_LOGO_SHA1/${{ steps.package.outputs.logo_sha }}/" \
            repo.xml.in > repo.xml

      - name: Commit repository metadata to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add repo.xml
          if ! git diff --cached --quiet; then
            git commit -m "Publish LMS add-on repository metadata"
            git push origin main
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Lyrion LMS add-ons v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/UnifiedSearch-${{ steps.version.outputs.version }}.zip
            dist/DefaultLogoHome-0.1.1.zip
